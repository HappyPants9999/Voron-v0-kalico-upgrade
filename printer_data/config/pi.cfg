[mcu rpi]
serial: /tmp/klipper_host_mcu

#####################################################################
#   Sensors
#####################################################################

[temperature_sensor pi]
sensor_type: temperature_host


#####################################################################
#   Input Shaper
#####################################################################
## The accelerometer lives on the EBB36 CAN toolhead, not the Pi -- see
## [adxl345] in bigtreetech-ebb-canbus-v1.2.cfg. Previously this file also
## defined its own [adxl345] with cs_pin: rpi:None; since the section name
## was the same, Klipper silently merged the two and the toolhead's pin
## definition happened to win only because this file loads first. Removed
## here so there's exactly one, explicit accelerometer definition.

[resonance_tester]
accel_chip: adxl345
probe_points: 60, 60, 20
#    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={run_current}
z_offset: 0.0


[safe_z_home]
home_xy_position: 60,60 #this should be the center of your bed
speed: 50 
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 110, 110
probe_count: 5, 3

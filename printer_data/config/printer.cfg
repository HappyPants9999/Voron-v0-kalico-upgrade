[include shell_command.cfg]
## LDO V0.2 Printer Configuration
## NOTE: The order of the [include] are IMPORTANT

#####################################################################
#   Demon Klipper Essentials Unified - prerequisites
#####################################################################
## Must be defined before the DKEU includes are added (once the installer
## has been run on the Pi and the Demon_Klipper_Essentials_Unified /
## Demon_User_Files directories actually exist). This is the only
## [save_variables] section in the config -- DKEU needs exactly one.
[save_variables]
filename: ~/demon_vars.cfg

## Required for DKEU's homing routine
[force_move]
enable_force_move: True

## DKEU's retraction settings -- pair with variable_use_fw_retract: True
## in the DKEU user settings file once that's in place
[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

#####################################################################
#   Demon Klipper Essentials Unified - main includes
#####################################################################
[include ./Demon_Klipper_Essentials_Unified/*.cfg]
[include ./Demon_User_Files/*.cfg]
## Auto-manages Demon_User_Files on future DKEU updates -- requires the Kiauh
## G-code Shell Command Extension to be installed (verify first: see notes).
[include ./Demon_Klipper_Essentials_Unified/Other_Files/Demon_User_Files_Updater/Demon_User_Files_Handler_v*.cfg]
[include ./KAMP_LiTE/*.cfg]
[include stealthburner_leds.cfg]
[include Heat_Soak_SB_LEDs.cfg]
## My_Macros.cfg doesn't exist yet -- create it (see the mainsail _CLIENT_VARIABLE
## setup) before uncommenting this include, or Klipper will fail to start.
[include My_Macros.cfg]


#####################################################################
#   User Interface Software
#####################################################################
## Uncomment depending on your software choice either Fluidd or Mainsail
# [include fluidd.cfg]
[include mainsail.cfg]

[mcu]
#####################################################################
# Obtain definition by "ls -l /dev/serial/by-id/"
#####################################################################
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1E005400175030544E393620-if00
restart_method: command

[include pi.cfg]
[include nevermore.cfg]
[include V0Display.cfg]
# [include macros.cfg]  ## replaced by Demon Klipper Essentials Unified -- left in place, not deleted, as a reference / fallback
[include led.cfg]
[include bigtreetech-ebb-canbus-v1.2.cfg]

[exclude_object]
#####################################################################
#   Main Controller Board
#####################################################################

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 9000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 6.0

#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PC8
## Refer to https://docs.vorondesign.com/build/startup/#v0
dir_pin: PC9                                                     # Check motor direction in link above. If inverted, add a ! before gpio10
enable_pin: !PA15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: ^PD3
position_endstop: 120
position_max: 120
homing_speed: 50                                                    # Can be increased after initial setup, Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PD9
interpolate: False
run_current: 0.5
diag_pin: PD3
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle

[autotune_tmc stepper_x]
motor: ldo-35sth52-1504ah
voltage: 24
sg4_thrs: 90

[stepper_y]
step_pin: PA10
## Refer to https://docs.vorondesign.com/build/startup/#v0
dir_pin: PA14
enable_pin: !PA13
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: ^PD2
position_endstop: 120
position_max: 120
homing_speed: 50                                                    # Can be increased after initial setup, Max 100
homing_retract_dist: 5
homing_positive_dir: true


[tmc2209 stepper_y]
uart_pin: PD8
interpolate: False
run_current: 0.5
diag_pin: PD2
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle

[autotune_tmc stepper_y]
motor: ldo-35sth52-1504ah
voltage: 24
sg4_thrs: 90

#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PA9
rotation_distance: 8                                                # For T8x8 integrated lead screw
microsteps: 32
#endstop_pin: ^PC3
endstop_pin: probe:z_virtual_endstop
#position_endstop: 120                                              # Default endstp position on the bottom for v0.2
position_max: 120
position_min: -4
homing_speed: 10
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: PB10
interpolate: False
## For LDO-42STH25-1004CL200E 1.0A
run_current: 0.50
diag_pin: PC3
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle

[autotune_tmc stepper_z]
motor: ldo-42sth25-1004cl200et
voltage: 24

#####################################################################
#   Probe
#####################################################################
[probe]
pin: ^EBBCan:PB9  # Replace with the GPIO pin connected to your ZeroClick probe
x_offset: -31.300
y_offset: -17.418
#z_offset: 0.0  # Replace with your actual Z offset (calibrated later)
speed: 10
sample_retract_dist: 3.0

#####################################################################
#   Bed Mesh
#####################################################################
[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 86.5, 102.5
probe_count: 5, 5

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA5
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: ATC Semitec 104NT-4-R025H42G 
sensor_pin: PA1
smooth_time: 3.0
#max_power: 0.6                                                     # Only needed for 100w pads
min_temp: 0
max_temp: 120
#control: pid                                                        # Do PID calibration after initial checks
#pid_kp: 68.453
#pid_ki: 2.749
#pid_kd: 426.122

#####################################################################
# Fan Control
#####################################################################


[controller_fan pcb_fan]                                            # Optional fan for cooling your PCBs
pin: PA4

[temperature_fan cb2_fan]
pin: CB2:gpiochip0/gpio19
sensor_type: temperature_host
control: watermark
min_temp: 0
max_temp: 85
target_temp: 45

#####################################################################
# Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

# Uncomment this section if you are using physical endstops
# [safe_z_home]
# home_xy_position: 120,120
# speed: 50.0
# z_hop: 5

## To be used with BED_SCREWS_ADJUST
[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

#####################################################################
#   Additional Sensors
#####################################################################

[temperature_sensor Chamber_Temp]
sensor_type: Generic 3950
sensor_pin: PA2
#pullup_resistor: 2200
pullup_resistor: 4700
min_temp: 0
max_temp: 100
gcode_id: chamber_th

#####################################################################
## FS - Frame PCB
## Filament Sensor 1
#####################################################################

[filament_switch_sensor filament_sensor]
switch_pin: !PC2
pause_on_runout: False
insert_gcode:
    { action_respond_info("Insert Detected") }
runout_gcode:
    { action_respond_info("Runout Detected") }
    {% if printer.print_stats.state == "printing" %}
      _FIL_CHANGE_PARK
    {% endif %}

[shaketune]


## Sensorless Homing
## This file contains configuration and macros pertaining to sensorless homing for the Voron 0.2 
## It is based on this guide: https://docs.vorondesign.com/community/howto/clee/sensorless_xy_homing.html

## *MAKE SURE* to include this config file *AFTER* the main controller config. 
## This will ensure the relavent sections are overwritten by the configurations specified here.

## If using SKR Pico or SKR mini E3 mainboards, make sure to set the X-DIAG and Y-DIAG jumpers to enable sensorless homing
## See here https://github.com/bigtreetech/SKR-Pico/blob/master/Hardware/BTT%20SKR%20Pico%20V1.0-PIN.pdf

[stepper_x]
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
diag_pin: ^PD3
driver_SGTHRS: 90

[stepper_y]
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
diag_pin: ^PD2
driver_SGTHRS: 90


## _HOME_X, _HOME_Y and [homing_override] used to be defined here by hand.
## Demon_Klipper_Essentials_Unified's demon_homing_control_v2.1.2.cfg defines
## sections with these exact same names (and already knows how to handle
## probe:z_virtual_endstop for Z), so the hand-rolled versions were removed
## to avoid a duplicate-section config error. The hardware settings below
## (virtual_endstop + diag_pin/driver_SGTHRS for sensorless X/Y) stay --
## DKEU's _HOME_X/_HOME_Y still need them, it just supplies the macro logic
## now, driven by the homing variables in demon_user_settings.

